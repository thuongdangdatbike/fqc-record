<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FQC ERA - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f3;
      color: #24332c;
    }

    main {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 16px #0001;
    }

    h2 {
      text-align: center;
      color: #176b50;
    }

    p { line-height: 1.5; }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #176b50;
      color: white;
    }

    button.secondary {
      background: #e8efeb;
      color: #176b50;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader { margin-top: 14px; }

    #result {
      background: #f1f5f3;
      border-radius: 10px;
      padding: 12px;
      overflow-wrap: anywhere;
      min-height: 44px;
    }

    .hint {
      font-size: 13px;
      color: #66736b;
    }
  </style>
</head>

<body>
<main>
  <h2>FQC ERA</h2>

  <p style="text-align:center">
    Quét mã QR để kiểm tra FQC
  </p>

  <button id="startBtn" onclick="startScanner()">
    Mở camera và quét QR
  </button>

  <button class="secondary" onclick="openManual()">
    Nhập mã QR thủ công
  </button>

  <div id="reader"></div>

  <p><b>Nội dung mã QR:</b></p>
  <div id="result">Chưa quét mã</div>

  <button id="continueBtn"
          onclick="continueToFQC()"
          disabled>
    Tiếp tục đến FQC record
  </button>

  <p id="message" class="hint">
    Nhấn Mở camera và quét QR, sau đó cho phép truy cập camera.
  </p>
</main>

<script>
  // URL Web App Apps Script của m
  const FQC_APP_URL =
    'https://script.google.com/macros/s/AKfycbzGxSNP10GY-k9BkBIyqGPSnIQ6m0AlMzzhC5AEDV7MIFASSJqXuJzN1VxdkaC4Rzl7bQ/exec';

  let scanner = null;
  let scannedText = '';
  let isProcessing = false;

  function setMessage(text) {
    document.getElementById('message').textContent = text;
  }

  async function startScanner() {
    if (isProcessing) return;

    if (!window.isSecureContext) {
      setMessage('Vui lòng mở website bằng HTTPS.');
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      setMessage(
        'Trình duyệt không hỗ trợ camera. Hãy mở bằng Chrome hoặc Safari.'
      );
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      setMessage(
        'Không tải được thư viện quét QR. Hãy kiểm tra kết nối Internet và tải lại trang.'
      );
      return;
    }

    try {
      if (!scanner) {
        scanner = new Html5Qrcode('reader');
      }

      document.getElementById('startBtn').disabled = true;
      setMessage('Đang mở camera...');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        async function(decodedText) {
          if (isProcessing) return;
          isProcessing = true;

          scannedText = decodedText.trim();

          document.getElementById('result').textContent =
            scannedText;

          document.getElementById('continueBtn').disabled = false;

          setMessage(
            'Đã đọc QR thành công. Nhấn Tiếp tục để sang FQC record.'
          );

          try {
            await scanner.stop();
          } catch (e) {
            // Camera có thể đã tự dừng.
          }

          document.getElementById('startBtn').disabled = false;
        },
        function(errorMessage) {
          // Bỏ qua lỗi đọc QR trong lúc camera đang quét.
        }
      );

      setMessage('Đưa mã QR vào trong khung camera.');
    } catch (error) {
      document.getElementById('startBtn').disabled = false;

      setMessage(
        'Không mở được camera: ' +
        (error.message || String(error)) +
        '. Hãy cấp quyền camera hoặc nhập mã thủ công.'
      );
    }
  }

  function openManual() {
    const value = prompt('Nhập chính xác nội dung mã QR:');

    if (value && value.trim()) {
      scannedText = value.trim();

      document.getElementById('result').textContent = scannedText;
      document.getElementById('continueBtn').disabled = false;

      setMessage(
        'Đã nhập mã. Nhấn Tiếp tục để sang FQC record.'
      );
    }
  }

  function continueToFQC() {
    if (!scannedText) {
      setMessage('Bạn chưa quét hoặc nhập mã QR.');
      return;
    }

    if (!FQC_APP_URL.startsWith('https://') ||
        !FQC_APP_URL.includes('/exec')) {
      setMessage('URL Web App FQC record không hợp lệ.');
      return;
    }

    const target = FQC_APP_URL +
      '?qr=' + encodeURIComponent(scannedText);
