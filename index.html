
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FQC ERA - QR Scanner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f3;
      color: #24332c;
    }

    main {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 16px #0001;
    }

    h2 { text-align: center; color: #176b50; }

    p { line-height: 1.5; }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #176b50;
      color: white;
    }

    button.secondary {
      background: #e8efeb;
      color: #176b50;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 14px;
      overflow: hidden;
    }

    #result {
      background: #f1f5f3;
      border-radius: 10px;
      padding: 12px;
      overflow-wrap: anywhere;
      min-height: 44px;
    }

    .hint {
      font-size: 13px;
      color: #66736b;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
<main>
  <h2>FQC ERA</h2>

  <p style="text-align:center">
    Quét mã QR để kiểm tra FQC
  </p>

  <button id="startBtn" type="button" onclick="startScanner()">
    Mở camera và quét QR
  </button>

  <button class="secondary" type="button" onclick="openManual()">
    Nhập mã QR thủ công
  </button>

  <div id="reader"></div>

  <p><b>Nội dung mã QR:</b></p>
  <div id="result">Chưa quét mã</div>

  <button id="continueBtn" type="button"
          onclick="continueToFQC()" disabled>
    Tiếp tục đến FQC record
  </button>

  <p id="message" class="hint">
    Nhấn Mở camera và cấp quyền camera khi trình duyệt hỏi.
  </p>
</main>

<script>
  const FQC_APP_URL =
    'https://script.google.com/macros/s/AKfycbzGxSNP10GY-k9BkBIyqGPSnIQ6m0AlMzzhC5AEDV7MIFASSJqXuJzN1VxdkaC4Rzl7bQ/exec';

  const QR_LIBRARY_SOURCES = [
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
    'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'
  ];

  let scanner = null;
  let scannedText = '';
  let isStarting = false;
  let isScanned = false;
  let libraryPromise = null;

  function setMessage(text) {
    document.getElementById('message').textContent = text;
  }

  function loadQrLibrary() {
    if (typeof Html5Qrcode !== 'undefined') {
      return Promise.resolve();
    }

    if (libraryPromise) {
      return libraryPromise;
    }

    libraryPromise = new Promise((resolve, reject) => {
      let index = 0;

      function tryNext() {
        if (typeof Html5Qrcode !== 'undefined') {
          resolve();
          return;
        }

        if (index >= QR_LIBRARY_SOURCES.length) {
          libraryPromise = null;
          reject(new Error(
            'Cả 3 nguồn thư viện đều không tải được. Hãy đổi mạng hoặc thử lại.'
          ));
          return;
        }

        const source = QR_LIBRARY_SOURCES[index++];
        setMessage('Đang tải thư viện quét QR (' + index + '/3)...');

        const script = document.createElement('script');
        script.src = source;
        script.async = true;

        script.onload = () => {
          if (typeof Html5Qrcode !== 'undefined') {
            resolve();
          } else {
            script.remove();
            tryNext();
          }
        };

        script.onerror = () => {
          script.remove();
          tryNext();
        };

        document.head.appendChild(script);
      }

      tryNext();
    });

    return libraryPromise;
  }

  async function startScanner() {
    if (isStarting || isScanned) return;

    if (!window.isSecureContext) {
      setMessage('Trang quét cần được mở bằng HTTPS.');
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      setMessage(
        'Trình duyệt không hỗ trợ camera. Hãy mở trang bằng Chrome hoặc Safari.'
      );
      return;
    }

    isStarting = true;

    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;

    try {
      await loadQrLibrary();

      if (!scanner) {
        scanner = new Html5Qrcode('reader');
      }

      setMessage('Đang mở camera...');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        async decodedText => {
          if (isScanned) return;

          isScanned = true;
          scannedText = decodedText.trim();

          document.getElementById('result').textContent = scannedText;
          document.getElementById('continueBtn').disabled = false;

          setMessage(
            'Đã quét QR thành công. Nhấn Tiếp tục đến FQC record.'
          );

          try {
            await scanner.stop();
          } catch (e) {}

          isStarting = false;
          startBtn.disabled = true;
        },
        () => {}
      );

      setMessage('Đưa mã QR vào giữa khung camera.');
    } catch (e) {
      isStarting = false;
      startBtn.disabled = false;

      setMessage(
        'Lỗi: ' + (e.message || String(e)) +
        ' Nếu lỗi thư viện, hãy đổi mạng Wi-Fi/4G rồi tải lại trang.'
      );
    }
  }

  function openManual() {
    const value = prompt('Nhập chính xác nội dung mã QR:');

    if (value && value.trim()) {
      scannedText = value.trim();
      isScanned = true;

      document.getElementById('result').textContent = scannedText;
      document.getElementById('continueBtn').disabled = false;
      document.getElementById('startBtn').disabled = true;

      setMessage('Đã nhập mã. Nhấn Tiếp tục đến FQC record.');
    }
  }

  function continueToFQC() {
    if (!scannedText) {
      setMessage('Bạn chưa quét hoặc nhập mã QR.');
      return;
    }

    if (!FQC_APP_URL.startsWith('https://')) {
      setMessage('URL FQC record không hợp lệ.');
      return;
    }

    const target = FQC_APP_URL + '?qr=' +
      encodeURIComponent(scannedText);

    window.location.href = target;
  }
</script>
</body>
</html>
