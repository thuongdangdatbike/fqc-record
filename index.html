
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FQC ERA - QR Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f3;
      color: #24332c;
    }
    main {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 16px #0001;
    }
    h2 { text-align: center; color: #176b50; }
    p { line-height: 1.5; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #176b50;
      color: white;
    }
    button.secondary {
      background: #e8efeb;
      color: #176b50;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #reader { margin-top: 14px; }
    #result {
      background: #f1f5f3;
      border-radius: 10px;
      padding: 12px;
      overflow-wrap: anywhere;
      min-height: 44px;
    }
    .hint { font-size: 13px; color: #66736b; }
  </style>
</head>

<body>
<main>
  <h2>FQC ERA</h2>
  <p style="text-align:center">Quét mã QR để kiểm tra FQC</p>

  <button id="startBtn" type="button" onclick="startScanner()">
    Mở camera và quét QR
  </button>

  <button class="secondary" type="button" onclick="openManual()">
    Nhập mã QR thủ công
  </button>

  <div id="reader"></div>

  <p><b>Nội dung mã QR:</b></p>
  <div id="result">Chưa quét mã</div>

  <button id="continueBtn" type="button"
          onclick="continueToFQC()" disabled>
    Tiếp tục đến FQC record
  </button>

  <p id="message" class="hint">
    Nhấn Mở camera và cho phép truy cập camera khi trình duyệt hỏi.
  </p>
</main>

<script>
  const FQC_APP_URL =
    'https://script.google.com/macros/s/AKfycbzGxSNP10GY-k9BkBIyqGPSnIQ6m0AlMzzhC5AEDV7MIFASSJqXuJzN1VxdkaC4Rzl7bQ/exec';

  let scanner = null;
  let scannedText = '';
  let isStarting = false;
  let isScanned = false;

  function setMessage(text) {
    document.getElementById('message').textContent = text;
  }

  async function startScanner() {
    if (isStarting || isScanned) return;

    if (!window.isSecureContext) {
      setMessage('Trang quét cần được mở bằng HTTPS.');
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      setMessage(
        'Trình duyệt không hỗ trợ camera. Hãy mở bằng Chrome hoặc Safari.'
      );
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      setMessage(
        'Không tải được thư viện quét QR. Kiểm tra Internet rồi tải lại trang.'
      );
      return;
    }

    const startBtn = document.getElementById('startBtn');
    isStarting = true;
    startBtn.disabled = true;
    setMessage('Đang mở camera...');

    try {
      if (!scanner) {
        scanner = new Html5Qrcode('reader');
      }

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        async decodedText => {
          if (isScanned) return;

          isScanned = true;
          scannedText = decodedText.trim();

          document.getElementById('result').textContent = scannedText;
          document.getElementById('continueBtn').disabled = false;
          setMessage('Đã quét QR thành công. Nhấn Tiếp tục đến FQC record.');

          try {
            await scanner.stop();
          } catch (e) {}

          isStarting = false;
          startBtn.disabled = false;
        },
        () => {}
      );

      setMessage('Đưa mã QR vào giữa khung camera.');
    } catch (e) {
      isStarting = false;
      startBtn.disabled = false;

      setMessage(
        'Không mở được camera: ' + (e.message || String(e)) +
        '. Hãy cấp quyền camera hoặc nhập mã thủ công.'
      );
    }
  }

  function openManual() {
    const value = prompt('Nhập chính xác nội dung mã QR:');

    if (value && value.trim()) {
      scannedText = value.trim();
      isScanned = true;

      document.getElementById('result').textContent = scannedText;
      document.getElementById('continueBtn').disabled = false;
      document.getElementById('startBtn').disabled = true;

      setMessage('Đã nhập mã. Nhấn Tiếp tục đến FQC record.');
    }
  }

  function continueToFQC() {
    if (!scannedText) {
      setMessage('Bạn chưa quét hoặc nhập mã QR.');
      return;
    }

    const target = FQC_APP_URL + '?qr=' +
      encodeURIComponent(scannedText);

    // Mở Apps Script ở tab hiện tại của trang GitHub.
    window.location.href = target;
  }
</script>
</body>
</html>
