
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FQC ERA - QR Scanner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #f3f5f8;
      color: #202938;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin-bottom: 22px;
      text-align: center;
      color: #687385;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd2dc;
      border-radius: 9px;
      font-size: 16px;
    }

    button, .open-link {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aab3c0;
      cursor: not-allowed;
    }

    .secondary { background: #455468; }
    .green { background: #15803d; }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      background: #e8f1ff;
      color: #174ea6;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      background: #feecec;
      color: #b42318;
    }

    .hint {
      margin-top: 10px;
      color: #687385;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>FQC ERA</h1>
    <div class="subtitle">Quét QR để truy xuất thông tin kiểm tra</div>

    <label for="qrInput">Nội dung QR</label>
    <input
      id="qrInput"
      type="text"
      placeholder="Quét QR hoặc nhập mã thủ công"
      autocomplete="off"
    >

    <button id="startButton" type="button" onclick="startScanner()">
      Mở camera và quét QR
    </button>

    <button
      id="stopButton"
      type="button"
      class="secondary"
      onclick="stopScanner()"
      style="display:none"
    >
      Tắt camera
    </button>

    <div id="reader"></div>

    <div class="hint">
      Nếu camera không hoạt động, hãy nhập QR thủ công. Nếu mở trang từ
      Zalo hoặc Messenger, hãy thử mở trang bằng Chrome hoặc Safari.
    </div>

    <button
      id="continueButton"
      type="button"
      class="green"
      onclick="continueToFQC()"
    >
      Tiếp tục đến FQC Record
    </button>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <!-- File này phải được tải lên GitHub cùng cấp với index.html -->
  <script src="./html5-qrcode.min.js"></script>

  <script>
    const FQC_APP_URL =
      'https://script.google.com/macros/s/AKfycbzGxSNP10GY-k9BkBIyqGPSnIQ6m0AlMzzhC5AEDV7MIFASSJqXuJzN1VxdkaC4Rzl7bQ/exec';

    let scanner = null;
    let scanning = false;
    let starting = false;
    let handledQR = false;

    const qrInput = document.getElementById('qrInput');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');
    const continueButton = document.getElementById('continueButton');
    const messageBox = document.getElementById('message');

    function showMessage(message, isError = false) {
      messageBox.replaceChildren();
      messageBox.textContent = message;
      messageBox.className = isError ? 'error' : '';
      messageBox.style.display = 'block';
    }

    async function startScanner() {
      if (starting || scanning) return;

      if (typeof Html5Qrcode === 'undefined') {
        showMessage(
          'Không tải được thư viện QR. Kiểm tra file html5-qrcode.min.js trên GitHub.',
          true
        );
        return;
      }

      starting = true;
      startButton.disabled = true;
      handledQR = false;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: function(width, height) {
              const size = Math.floor(Math.min(width, height) * 0.75);
              return { width: size, height: size };
            }
          },
          async function(decodedText) {
            if (handledQR) return;

            handledQR = true;
            qrInput.value = decodedText;
            showMessage(
              'Quét QR thành công. Nhấn "Tiếp tục đến FQC Record" để mở trang kiểm tra.'
            );

            await stopScanner();
          },
          function() {
            // Bỏ qua lỗi nhận diện trong lúc camera đang quét.
          }
        );

        scanning = true;
        stopButton.style.display = 'block';
        showMessage('Camera đã mở. Đưa mã QR vào khung quét.');
      } catch (error) {
        scanning = false;

        const detail = error && error.message
          ? error.message
          : String(error || 'Không xác định');

        showMessage(
          'Không mở được camera. Kiểm tra quyền camera và thử Chrome/Safari. Chi tiết: ' +
          detail,
          true
        );
      } finally {
        starting = false;
        startButton.disabled = false;
      }
    }

    async function stopScanner() {
      if (!scanner || !scanning) {
        stopButton.style.display = 'none';
        return;
      }

      try {
        await scanner.stop();
      } catch (error) {
        console.warn('Lỗi khi dừng camera:', error);
      }

      scanning = false;
      stopButton.style.display = 'none';
    }

    function continueToFQC() {
      const qr = qrInput.value.trim();

      if (!qr) {
        showMessage('Vui lòng quét QR hoặc nhập mã QR trước.', true);
        qrInput.focus();
        return;
      }

      const target = FQC_APP_URL + '?qr=' + encodeURIComponent(qr);

      // Dùng link để người dùng chủ động mở FQC Record.
      showMessage(
        'Mã QR đã sẵn sàng. Nhấn nút bên dưới để mở FQC Record.'
      );

      const link = document.createElement('a');
      link.href = target;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'open-link';
      link.textContent = 'MỞ FQC RECORD';

      messageBox.appendChild(link);
      link.focus();
    }

    // Hỗ trợ trường hợp trang nhận QR qua URL.
    const params = new URLSearchParams(window.location.search);
    const receivedQR = params.get('qr');

    if (receivedQR) {
      qrInput.value = receivedQR;
      showMessage('Đã nhận mã QR. Nhấn "Tiếp tục đến FQC Record".');
    }
  </script>
</body>
</html>
